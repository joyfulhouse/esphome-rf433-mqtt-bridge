# Copy to secrets.yaml and fill in your own values. Never commit secrets.yaml.
wifi_ssid: "YOUR_WIFI_SSID"
wifi_password: "YOUR_WIFI_PASSWORD"

# MQTT credentials for the broker the bridge should use. With Home Assistant's
# Mosquitto add-on, create a dedicated least-privilege HA user for the bridges.
# Authenticated MQTT is required; anonymous broker access is unsupported.
mqtt_username: "rf433-bridge"
mqtt_password: "YOUR_MQTT_PASSWORD"

# Per-device ESPHome native API key (32-byte base64; generate your own with
# `openssl rand -base64 32` — the value below is a placeholder that only exists
# so `esphome config` validates; it decodes to the ASCII text
# "REPLACE-WITH-YOUR-OWN-KEY-32byte". ESPHome 2026.9+ rejects the all-zeros key)
# and OTA password.
rf433_bridge_living_room_api_key: "UkVQTEFDRS1XSVRILVlPVVItT1dOLUtFWS0zMmJ5dGU="
rf433_bridge_living_room_ota_password: "REPLACE_WITH_OTA_PASSWORD"
rf433_bridge_bedroom_api_key: "UkVQTEFDRS1XSVRILVlPVVItT1dOLUtFWS0zMmJ5dGU="
rf433_bridge_bedroom_ota_password: "REPLACE_WITH_OTA_PASSWORD"
